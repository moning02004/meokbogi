name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      # 모델을 바꾸고 마이그레이션을 빠뜨리면 여기서 걸린다
      - name: Migrations are up to date
        run: python manage.py makemigrations --check --dry-run

      # 기본 설정(settings/base.py)은 SQLite를 쓰므로 DB 서비스가 필요 없다
      - name: Test
        run: python manage.py test

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      # next-env.d.ts가 gitignore 대상이라 tsc 단독보다 빌드(타입 검사 포함)가 확실하다
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_HOST: http://localhost:8000

  # 실제 API(SQLite)와 웹 빌드를 띄우고 모바일 크기 Chromium으로 돈다 (web/e2e)
  e2e:
    runs-on: ubuntu-latest
    needs: [api, web]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: api/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: |
          pip install -r ../api/requirements.txt
          npm ci
          npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
