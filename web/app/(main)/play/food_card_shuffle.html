<h2 class="sr-only">치킨, 피자, 회, 중식, 찜닭, 집밥, 토스트, 족발, 떡볶이, 아구찜 카드가 밝은 파스텔톤 어두운 판 위에 펼쳐져 보인다. 섞기를 누르면 순위가 지워지며 카드가 섞이고, 멈추면 왼쪽 상단부터 1등, 2등 순으로 순위가 매겨진다.</h2>
<div style="display:flex; flex-direction:column; align-items:center; gap:1.25rem; padding:1rem 0;">
  <div style="width:100%; max-width:520px; background:#3C3942; border-radius:16px; padding:20px;">
    <div id="deck" style="position:relative; width:100%; height:340px;"></div>
  </div>

  <button id="shuffleBtn" style="font-weight:500; padding:0.6rem 1.5rem;">섞기 <i class="ti ti-arrows-shuffle" style="font-size:16px; vertical-align:-2px; margin-left:4px;"></i></button>

  <div id="resultBox" style="font-size:18px; font-weight:500; min-height:28px; color:var(--text-accent);"></div>
</div>

<script>
const items = ['치킨','피자','회','중식','찜닭','집밥','토스트','족발','떡볶이','아구찜'];
const accentColors = ['#E08A5E','#4FBF9A','#9C93E8','#E8A94A','#E087A8','#6FA8E0','#7FBF4A','#E0787E','#D9C24E','#5FB8B0'];
const cardBg = '#FAF6EC';

const deck = document.getElementById('deck');
const shuffleBtn = document.getElementById('shuffleBtn');
const resultBox = document.getElementById('resultBox');
const n = items.length;
const cardW = 68, cardH = 96;
const boxH = 340;
let busy = false;
const cards = [];

function getBoxW(){ return deck.clientWidth || 480; }

function gridPositions(){
  const boxW = getBoxW();
  const cols = Math.min(4, n);
  const rows = Math.ceil(n / cols);
  const gapX = 14, gapY = 16;
  const gridH = rows * cardH + (rows-1) * gapY;
  const startY = (boxH - gridH) / 2;
  const pos = [];
  for(let i=0;i<n;i++){
    const row = Math.floor(i / cols);
    const col = i % cols;
    const itemsInRow = Math.min(cols, n - row*cols);
    const rowW = itemsInRow * cardW + (itemsInRow-1) * gapX;
    const rowStartX = (boxW - rowW) / 2;
    pos.push({ x: rowStartX + col*(cardW+gapX), y: startY + row*(cardH+gapY) });
  }
  return pos;
}

function getCenter(){
  const boxW = getBoxW();
  return { cx: boxW/2 - cardW/2, cy: boxH/2 - cardH/2 };
}

function setCard(card, x, y, r, scale, z){
  card.style.left = x + 'px';
  card.style.top = y + 'px';
  card.style.zIndex = z;
  card.style.transform = 'rotate(' + r + 'deg) scale(' + (scale || 1) + ')';
}

function flipFace(card, faceUp){
  card.firstChild.style.transform = faceUp ? 'rotateY(0deg)' : 'rotateY(180deg)';
}

function setRank(card, rank){
  const topRank = card.querySelector('.rank-top');
  const bottomRank = card.querySelector('.rank-bottom');
  if(topRank) topRank.textContent = rank;
  if(bottomRank) bottomRank.textContent = rank;
}

function buildDeck(){
  deck.innerHTML = '';
  cards.length = 0;
  const pos = gridPositions();
  for(let i=0;i<n;i++){
    const accent = accentColors[i % accentColors.length];
    const rank = i + 1;

    const card = document.createElement('div');
    card.style.cssText = 'position:absolute; width:' + cardW + 'px; height:' + cardH + 'px; transition: left 0.45s ease, top 0.45s ease, transform 0.45s ease; left:' + pos[i].x + 'px; top:' + pos[i].y + 'px; border-radius:8px;';
    const inner = document.createElement('div');
    inner.style.cssText = 'position:relative; width:100%; height:100%; transform-style:preserve-3d; transition: transform 0.35s ease;';

    const front = document.createElement('div');
    front.style.cssText = 'position:absolute; inset:0; border-radius:8px; border:1px solid #E4DCC8; background:' + cardBg + '; box-shadow:0 1px 4px rgba(0,0,0,0.35); backface-visibility:hidden; padding:6px; box-sizing:border-box; display:flex; flex-direction:column; justify-content:space-between;';
    front.innerHTML =
      '<span class="rank-top" style="font-size:11px; font-weight:500; color:#8A8474;">' + rank + '</span>' +
      '<div style="display:flex; align-items:center; justify-content:center;">' +
        '<span style="font-size:16px; font-weight:500; color:' + accent + '; text-align:center; line-height:1.3;">' + items[i] + '</span>' +
      '</div>' +
      '<span class="rank-bottom" style="font-size:11px; font-weight:500; color:#8A8474; align-self:flex-end; transform:rotate(180deg);">' + rank + '</span>';

    const back = document.createElement('div');
    back.style.cssText = 'position:absolute; inset:0; border-radius:8px; border:0.5px solid #6B6772; background:repeating-linear-gradient(45deg, #504C58, #504C58 4px, #5E5A66 4px, #5E5A66 8px); display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,0.35); backface-visibility:hidden; transform:rotateY(180deg);';
    back.innerHTML = '<i class="ti ti-tools-kitchen-2" style="font-size:20px; color:#D6D2DC;" aria-hidden="true"></i>';

    inner.appendChild(front);
    inner.appendChild(back);
    card.appendChild(inner);
    card.dataset.item = items[i];
    deck.appendChild(card);
    cards.push(card);
  }
}

function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

function shuffleArray(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

async function shuffleSequence(){
  const pos = gridPositions();
  cards.forEach(function(card, i){ setCard(card, pos[i].x, pos[i].y, 0, 1, 1); });
  await wait(150);

  cards.forEach(function(card){ flipFace(card, false); });
  await wait(300);

  const center = getCenter();
  const scatterRounds = 6;
  for(let round=0; round<scatterRounds; round++){
    cards.forEach(function(card, i){
      const jx = center.cx + (Math.random()-0.5) * 220;
      const jy = center.cy + (Math.random()-0.5) * 150;
      const jr = (Math.random()-0.5) * 70;
      setCard(card, jx, jy, jr, 1, i);
    });
    await wait(220);
  }

  cards.forEach(function(card, i){
    const stackR = (Math.random()-0.5) * 8;
    setCard(card, center.cx + (Math.random()-0.5)*4, center.cy + (Math.random()-0.5)*4, stackR, 1, i);
  });
  await wait(500);

  const order = shuffleArray(cards);
  const finalPos = gridPositions();
  order.forEach(function(card, i){
    setCard(card, finalPos[i].x, finalPos[i].y, 0, 1, i);
    setRank(card, i + 1);
  });
  await wait(500);

  order.forEach(function(card){ flipFace(card, true); });
  await wait(350);

  const winnerCard = order[0];
  const winnerIdx = cards.indexOf(winnerCard);
  winnerCard.firstChild.children[0].style.border = '2px solid ' + accentColors[winnerIdx % accentColors.length];
  setCard(winnerCard, finalPos[0].x, finalPos[0].y, 0, 1.1, 10);

  resultBox.textContent = items[winnerIdx] + ' 당첨!';
  shuffleBtn.disabled = false;
  busy = false;
}

shuffleBtn.addEventListener('click', function(){
  if(busy) return;
  busy = true;
  shuffleBtn.disabled = true;
  resultBox.textContent = '';
  cards.forEach(function(card){
    card.firstChild.children[0].style.border = '1px solid #E4DCC8';
  });
  shuffleSequence();
});

buildDeck();
window.addEventListener('resize', function(){
  if(!busy){
    const pos = gridPositions();
    cards.forEach(function(card, i){ setCard(card, pos[i].x, pos[i].y, 0, 1, 1); });
  }
});
</script>
